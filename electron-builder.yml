appId: dev.yoancuervo.atropos
productName: Atropos
directories:
  buildResources: build
files:
  - out/**
  - "!out/statusline/**"
  - resources/**
  - package.json
asarUnpack:
  - "resources/**"
extraResources:
  - from: out/statusline/index.mjs
    to: statusline/index.mjs
  - from: src/statusline/atropos-statusline.cmd
    to: statusline/atropos-statusline.cmd
win:
  executableName: Atropos
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
npmRebuild: false
